[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ins-gps-fusion-lab"
version = "0.1.0"
description = "INS-GPS Simulation & Fusion Suite — open-source sensor fusion research and validation toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/your-username/ins-gps-fusion-lab"

[tool.setuptools.packages.find]
where = ["."]
include = ["simulation*", "filters*", "experiments*", "visualization*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
